<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#233747;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}header{padding:32px max(24px,calc((100% - 1680px)/2));background:white;border-bottom:1px solid #dce4e9}h1{font-size:28px;margin:0 0 10px}header p{margin:0;color:#5f707d;max-width:1050px}main{max-width:1728px;padding:24px;margin:auto}nav{display:flex;gap:10px;margin-top:20px}button{font:inherit;background:white;border:1px solid #cad8e1;border-radius:9px;padding:8px 20px;color:#233747;cursor:pointer}button[aria-pressed=true]{background:#eaf5fc;color:#075c96;border-color:#1476b8}h2{font-size:22px;margin:28px 0 14px}.comparison{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:20px}figure{margin:0;min-width:0;border:1px solid #dce4e9;border-radius:12px;overflow:hidden;background:white}figcaption{padding:12px 18px;font-weight:600;border-bottom:1px solid #dce4e9}a{color:#075c96}figcaption a{float:right;font-size:14px;font-weight:400}.frame img{width:100%;display:block}.viewport .frame{aspect-ratio:var(--ratio);overflow:hidden}.notes{color:#5f707d;font-size:14px;margin-top:24px}.mobile .comparison{max-width:820px;margin:auto}.mobile .frame{max-width:390px;margin:auto}.mobile .desktop-only{display:none}@media(max-width:700px){.comparison{grid-template-columns:1fr}header{padding:24px}h1{font-size:24px}main{padding:16px}}
</style></head><body><header><h1>英语学习网站 · 改版前后截图</h1><p>来自现有项目的真实 Chrome 页面。词汇、词库与设置使用空学习记录；练习使用相同的 5 个真实词汇作为测试记录。测试在隔离浏览器中完成，不代表用户实际进度。</p><nav aria-label="截图宽度"><button data-width="1440" aria-pressed="true">1440 px</button><button data-width="1920" aria-pressed="false">1920 px</button><button data-width="390" aria-pressed="false">手机 390 px</button></nav></header><main><section class=" " data-page="vocabulary"><h2>词汇主页面</h2><div class="comparison"><figure><figcaption>改版前<a data-folder="before" href="before/vocabulary-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="before" src="before/vocabulary-1440.png" alt="词汇主页面，改版前，1440像素宽度" loading="lazy"></div></figure><figure><figcaption>改版后<a data-folder="after" href="after/vocabulary-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="after" src="after/vocabulary-1440.png" alt="词汇主页面，改版后，1440像素宽度" loading="lazy"></div></figure></div></section><section class="viewport desktop-only" data-page="library"><h2>词库与筛选</h2><div class="comparison"><figure><figcaption>改版前<a data-folder="before" href="before/library-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="before" src="before/library-1440.png" alt="词库与筛选，改版前，1440像素宽度" loading="lazy"></div></figure><figure><figcaption>改版后<a data-folder="after" href="after/library-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="after" src="after/library-1440.png" alt="词库与筛选，改版后，1440像素宽度" loading="lazy"></div></figure></div></section><section class="viewport " data-page="practice"><h2>练习题面</h2><div class="comparison"><figure><figcaption>改版前<a data-folder="before" href="before/practice-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="before" src="before/practice-1440.png" alt="练习题面，改版前，1440像素宽度" loading="lazy"></div></figure><figure><figcaption>改版后<a data-folder="after" href="after/practice-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="after" src="after/practice-1440.png" alt="练习题面，改版后，1440像素宽度" loading="lazy"></div></figure></div></section><section class="viewport " data-page="feedback"><h2>答案反馈</h2><div class="comparison"><figure><figcaption>改版前<a data-folder="before" href="before/feedback-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="before" src="before/feedback-1440.png" alt="答案反馈，改版前，1440像素宽度" loading="lazy"></div></figure><figure><figcaption>改版后<a data-folder="after" href="after/feedback-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="after" src="after/feedback-1440.png" alt="答案反馈，改版后，1440像素宽度" loading="lazy"></div></figure></div></section><section class="viewport desktop-only" data-page="settings"><h2>语音设置</h2><div class="comparison"><figure><figcaption>改版前<a data-folder="before" href="before/settings-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="before" src="before/settings-1440.png" alt="语音设置，改版前，1440像素宽度" loading="lazy"></div></figure><figure><figcaption>改版后<a data-folder="after" href="after/settings-1440.png" target="_blank">查看原图</a></figcaption><div class="frame"><img data-folder="after" src="after/settings-1440.png" alt="语音设置，改版后，1440像素宽度" loading="lazy"></div></figure></div></section><p class="notes">词汇页展示完整页面；全屏练习与弹层按原视口比例展示，点击“查看原图”可检查完整截图。改版前部分浮层原图含视口下方的底层页面，已保留原始文件。<a href="../../docs/VISUAL_REDESIGN.md">改动与测试说明</a></p></main><script>
function setWidth(width){document.body.classList.toggle('mobile',width==='390');document.documentElement.style.setProperty('--ratio',width+'/'+(width==='390'?844:1000));document.querySelectorAll('button[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.width===width)));document.querySelectorAll('section[data-page]').forEach(section=>{const w=width==='390'&&section.classList.contains('desktop-only')?'1440':width;section.querySelectorAll('[data-folder]').forEach(el=>{const url=el.dataset.folder+'/'+section.dataset.page+'-'+w+'.png';if(el.tagName==='IMG'){el.src=url;el.alt=section.querySelector('h2').textContent+'，'+(el.dataset.folder==='before'?'改版前':'改版后')+'，'+w+'像素宽度';}else el.href=url;});});}
document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>setWidth(button.dataset.width)));setWidth('1440');
</script></body></html>
